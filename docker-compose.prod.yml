# Production stack: PostgreSQL + API + storefront + admin, behind one nginx reverse proxy.
#
#   1. cp .env.prod.example .env.prod   and fill in every value
#   2. docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Only the proxy publishes a port. The database and the API are reachable only inside the
# compose network, so nothing but HTTP/HTTPS is exposed to the internet.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: onshop
      Jwt__Audience: onshop
      Seed__AdminUserName: ${ADMIN_USERNAME}
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      Api__PublicBaseUrl: ${PUBLIC_BASE_URL}
      Storefront__BaseUrl: ${PUBLIC_BASE_URL}
      Cors__Origins__0: ${PUBLIC_BASE_URL}
      Cors__Origins__1: ${ADMIN_BASE_URL}
      Payment__Gateway: ${PAYMENT_GATEWAY}
      Payment__Zarinpal__MerchantId: ${ZARINPAL_MERCHANT_ID:-}
      Payment__Zarinpal__Sandbox: ${ZARINPAL_SANDBOX:-false}
      Kyan__BaseUrl: ${KYAN_BASE_URL:-}
      Kyan__ApiKey: ${KYAN_API_KEY:-}
      Storage__UploadsPath: /app/uploads
    volumes:
      - uploads:/app/uploads

  storefront:
    build:
      context: ./storefront
      args:
        API_URL: http://api:8080
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL}
        MAP_TILE_ORIGIN: ${MAP_TILE_ORIGIN:-https://tile.openstreetmap.org}
    restart: unless-stopped
    depends_on:
      - api

  admin:
    build:
      context: ./admin
      args:
        VITE_STOREFRONT_URL: ${PUBLIC_BASE_URL}
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - storefront
      - admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  uploads:
