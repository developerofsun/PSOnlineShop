# Production stack for a server that ALREADY runs nginx + SSL on the host.
#
# The host nginx is the only public entry point. These containers publish their ports on
# 127.0.0.1 only, so nothing is reachable from the internet except through nginx.
#
#   host nginx :443  ->  127.0.0.1:3000  storefront
#                    ->  127.0.0.1:8080  api
#                    ->  127.0.0.1:8081  admin
#
# Start:  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: onshop
      Jwt__Audience: onshop
      Seed__AdminUserName: ${ADMIN_USERNAME}
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      Api__PublicBaseUrl: ${PUBLIC_BASE_URL}
      Storefront__BaseUrl: ${PUBLIC_BASE_URL}
      Cors__Origins__0: ${PUBLIC_BASE_URL}
      Cors__Origins__1: ${ADMIN_BASE_URL}
      Payment__Gateway: ${PAYMENT_GATEWAY}
      Payment__Zarinpal__MerchantId: ${ZARINPAL_MERCHANT_ID:-}
      Payment__Zarinpal__Sandbox: ${ZARINPAL_SANDBOX:-false}
      Kyan__BaseUrl: ${KYAN_BASE_URL:-}
      Kyan__ApiKey: ${KYAN_API_KEY:-}
      Storage__UploadsPath: /app/uploads
    volumes:
      - uploads:/app/uploads

  storefront:
    build:
      context: ./storefront
      args:
        API_URL: http://api:8080
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL}
        MAP_TILE_ORIGIN: ${MAP_TILE_ORIGIN:-https://tile.openstreetmap.org}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Read at runtime by server components; must match the build arg above.
      API_URL: http://api:8080

  admin:
    build:
      context: ./admin
      args:
        VITE_STOREFRONT_URL: ${PUBLIC_BASE_URL}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:80"

volumes:
  pgdata:
  uploads:
